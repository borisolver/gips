name: Update GIPS and publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every five minutes, offset from the start of the hour. GitHub may delay runs.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: read

concurrency:
  group: gips-production
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'borisolver/gips' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install image validation dependency
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: 'Pillow==13.0.0'

      - name: Test the cloud update timer
        run: python3 -m unittest discover -s ops/watchdog -v

      - name: Sync, build, test, and save the public data
        run: python3 scripts/run_update.py --artifact-dir "$RUNNER_TEMP/gips-pages" --push

      - name: Upload only the public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/gips-pages
          retention-days: 1

  deploy:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Deploy in this run: a GITHUB_TOKEN commit does not trigger a push build.
      # Unchanged successful syncs also deploy, retrying any prior deploy failure.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
