name: Check GIPS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the existing image validation dependency
        run: python3 -m pip install --disable-pip-version-check --only-binary=:all: 'Pillow==13.0.0'
      - name: Test source and public share artifact offline
        run: python3 -m unittest discover -s tests -v
      - name: Test the existing cloud update timer
        run: python3 -m unittest discover -s ops/watchdog -v
